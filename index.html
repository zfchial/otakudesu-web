<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NanoStream — Streaming Anime Subtitle Indonesia</title>
<meta name="description" content="Platform streaming anime subtitle Indonesia dari OtakuDesu, Samehadaku, dan Anibiplay.">
<meta name="theme-color" id="metaThemeColor" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NanoStream">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="offlineBanner" class="offline-banner hidden">Mode offline aktif — menampilkan halaman tersimpan</div>
<header class="topbar">
  <div class="nav-shell">
    <a class="brand" href="#" onclick="navClick('home',loadHome);return false">
      <span class="brand-mark">N</span>
      <span class="brand-text">Nano<span>Stream</span></span>
    </a>
    <nav class="main-nav" aria-label="Navigasi utama">
      <a href="#" data-nav="home" class="active" onclick="navClick('home',loadHome);return false">Home</a>
      <a href="#" data-nav="ongoing" onclick="navClick('ongoing',()=>loadOngoing(1));return false">Ongoing</a>
      <a href="#" data-nav="complete" onclick="navClick('complete',()=>loadComplete(1));return false">Complete</a>
      <a href="#" data-nav="genres" onclick="navClick('genres',loadGenres);return false">Genres</a>
      <a href="#" data-nav="samehadaku" onclick="navClick('samehadaku',loadSamehadakuHome);return false">Samehadaku</a>
      <a href="#" data-nav="anibi" onclick="navClick('anibi',loadAnibi);return false">Jadwal</a>
      <a href="#" data-nav="bookmarks" onclick="navClick('bookmarks',loadBookmarks);return false">Daftar Saya</a>
      <a href="#" data-nav="history" onclick="navClick('history',loadHistory);return false">Riwayat</a>
    </nav>
    <div class="nav-actions">
      <div class="search desktop-search">
        <select id="searchSource" aria-label="Sumber pencarian" onchange="syncSearchSource(this.value)">
          <option value="otakudesu">OtakuDesu</option>
          <option value="samehadaku">Samehadaku</option>
          <option value="anibi">Anibiplay</option>
        </select>
        <input id="searchInput" type="search" placeholder="Judul anime..." onkeydown="if(event.key==='Enter')searchGo()">
        <button onclick="searchGo()" aria-label="Cari">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <button id="installBtn" class="btn-install hidden" onclick="installPWA()" title="Install Aplikasi NanoStream">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Install</span>
      </button>
      <button class="account-button" onclick="accountAction()">
        <span class="account-dot"></span>
        <span id="account-label">Login</span>
      </button>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-pills" aria-label="Filter kategori cepat">
    <button data-pill="home" class="pill active" onclick="navClick('home',loadHome)">Beranda</button>
    <button data-pill="ongoing" class="pill" onclick="navClick('ongoing',()=>loadOngoing(1))">Ongoing</button>
    <button data-pill="complete" class="pill" onclick="navClick('complete',()=>loadComplete(1))">Tamat</button>
    <button data-pill="samehadaku" class="pill" onclick="navClick('samehadaku',loadSamehadakuHome)">Samehadaku</button>
    <button data-pill="anibi" class="pill" onclick="navClick('anibi',loadAnibi)">Jadwal Rilis</button>
    <button data-pill="genres" class="pill" onclick="navClick('genres',loadGenres)">Genre</button>
  </div>
</header>

<div id="searchSheet" class="search-sheet hidden" role="dialog" aria-modal="true" aria-label="Pencarian Anime">
  <div class="search-sheet-head">
    <button class="sheet-back" onclick="closeSearchSheet()" aria-label="Tutup pencarian">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <input id="mobileSearchInput" type="search" placeholder="Cari anime, judul, studio..." onkeydown="if(event.key==='Enter')mobileSearchGo()">
    <button class="sheet-go" onclick="mobileSearchGo()">Cari</button>
  </div>
  <div class="search-sheet-sources">
    <span>Sumber Katalog:</span>
    <div class="source-chips">
      <button data-src="otakudesu" class="src-chip active" onclick="syncSearchSource('otakudesu')">OtakuDesu</button>
      <button data-src="samehadaku" class="src-chip" onclick="syncSearchSource('samehadaku')">Samehadaku</button>
      <button data-src="anibi" class="src-chip" onclick="syncSearchSource('anibi')">Anibiplay</button>
    </div>
  </div>
</div>

<main>
  <div id="loading" class="loader hidden" role="status" aria-label="Memuat"><div></div></div>
  <div id="content"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-left">
      <a class="brand small" href="#" onclick="navClick('home',loadHome);return false">
        <span class="brand-mark">N</span>
        <span class="brand-text">Nano<span>Stream</span></span>
      </a>
      <p>Streaming anime multi-sumber subtitle Indonesia.</p>
    </div>
    <div class="footer-right">
      <span>PWA Ready</span>
      <span>·</span>
      <span>OtakuDesu · Samehadaku · Anibiplay</span>
    </div>
  </div>
</footer>

<nav class="bottom-nav" aria-label="Navigasi bawah mobile">
  <button data-bnav="home" class="bnav-item active" onclick="navClick('home',loadHome)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </button>
  <button data-bnav="samehadaku" class="bnav-item" onclick="navClick('samehadaku',loadSamehadakuHome)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
    <span>Mirror</span>
  </button>
  <button data-bnav="anibi" class="bnav-item" onclick="navClick('anibi',loadAnibi)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
    <span>Jadwal</span>
  </button>
  <button data-bnav="search" class="bnav-item" onclick="openSearchSheet()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Cari</span>
  </button>
  <button data-bnav="bookmarks" class="bnav-item" onclick="navClick('bookmarks',loadBookmarks)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
    <span>Daftar Saya</span>
  </button>
</nav>

<div id="toast" class="toast hidden" role="alert"></div>
<script src="app.js"></script>
</body>
</html>
